                - generic [ref=e57]: Active since 1988
              - paragraph [ref=e58]: "Thomas Stanley Holland (born 1 June 1996) is a British actor. His accolades include a BAFTA Award as well as two Critics' Choice Awards nominations. His films as a lead actor have grossed over $9.9 billion worldwide. He was featured on the Forbes 30 Under 30 Europe list of 2019. Holland's career began as a teen when he played a supporting role and later the title role in Billy Elliot the Musical on the West End from 2008 to 2010. He made his film debut in the disaster drama The Impossible (2012) followed by roles in the romance drama How I Live Now (2013) and the historical adventure dramas In the Heart of the Sea (2015) and The Lost City of Z (2016). Holland achieved international recognition playing Peter Parker/Spider-Man in six Marvel Cinematic Universe (MCU) superhero films, beginning with Captain America: Civil War (2016). The following year, Holland received the BAFTA Rising Star Award and became the youngest actor to play a title role in an MCU film in Spider-Man: Homecoming. Its sequels, Far From Home (2019) and No Way Home (2021), each grossed more than $1 billion worldwide; the latter became the highest-grossing film of the year. Holland played against-type roles in the crime dramas The Devil All the Time (2020) and Cherry (2021), and starred in the big-budget films Uncharted (2022) and The Odyssey (2026). Holland has voiced roles in the animated features Spies in Disguise (2019) and Onward (2020). On television, he took roles in the PBS historical miniseries Wolf Hall (2015) and the Apple TV+ psychological thriller limited series The Crowded Room (2023). He returned to the stage starring as one of the title roles in the West End revival of Romeo and Juliet (2024). He is married to his longtime co-star Zendaya. Description above from the Wikipedia article Tom Holland, licensed under CC-BY-SA, full list of contributors on Wikipedia."
